name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Check the tag against the package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          [ "$expected" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match $expected"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run check:package
      - name: Check whether the version is already on the registry
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          output=$(npm view "hexo-theme-zhimo@$version" version 2>&1) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "hexo-theme-zhimo@$version is already on the registry, npm publish is skipped"
          elif printf '%s' "$output" | grep -q E404; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output"
            exit 1
          fi
      - name: Publish to npm
        if: steps.registry.outputs.already != 'true'
        run: npm publish --provenance

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        run: |
          notes=$(git log -1 --pretty=%b "$GITHUB_SHA")
          [ -n "$notes" ] || { echo "the commit tagged $GITHUB_REF_NAME has no release notes in its message body"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
